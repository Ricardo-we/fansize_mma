<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más Que Pelear — Artes Marciales</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson: #8B1A1A;
      --crimson-light: #b52222;
      --black: #0a0a0a;
      --off-white: #f0ece4;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--black);
      color: var(--off-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 60px;
      background: var(--black);
      border-bottom: 2px solid var(--crimson);
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--off-white);
    }

    .nav-logo span { color: var(--crimson); }

    .nav-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }

    /* HERO STRIP */
    .hero-strip {
      background: var(--crimson);
      padding: 40px 40px 36px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-shrink: 0;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 100px);
      line-height: .9;
      letter-spacing: 3px;
      color: var(--off-white);
    }

    .hero-title em {
      display: block;
      font-style: normal;
      color: rgba(255,255,255,.35);
      font-size: 40%;
      letter-spacing: 6px;
      margin-bottom: 8px;
    }

    .hero-desc {
      max-width: 340px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,.65);
      text-align: right;
    }

    /* PDF SECTION */
    .pdf-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 40px 0;
      min-height: 0;
    }

    .pdf-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .pdf-bar-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
    }

    .pdf-download {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--off-white);
      text-decoration: none;
      border: 1px solid var(--crimson);
      padding: 6px 16px;
      transition: background .2s;
    }

    .pdf-download:hover { background: var(--crimson); }

    .pdf-frame-wrap {
      flex: 1;
      border: 2px solid var(--crimson);
      background: #fff;
      min-height: 70vh;
    }

    .pdf-frame-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 70vh;
      border: none;
    }

    /* FOOTER */
    footer {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(139,26,26,.3);
      margin-top: 24px;
    }

    footer p {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,.2);
    }

    @media (max-width: 600px) {
      nav, .hero-strip, .pdf-wrap, footer { padding-left: 20px; padding-right: 20px; }
      .hero-strip { flex-direction: column; align-items: flex-start; }
      .hero-desc { text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">MÁS QUE <span>PELEAR</span></div>
    <span class="nav-tag">Artes Marciales</span>
  </nav>

  <div class="hero-strip">
    <h1 class="hero-title">
      <em>La Mente del Guerrero</em>
      MÁS QUE<br>PELEAR
    </h1>
    <p class="hero-desc">Una exploración del espíritu, la disciplina y el poder transformador de las artes marciales más allá del combate.</p>
  </div>

  <div class="pdf-wrap">
    <div class="pdf-bar">
      <span class="pdf-bar-label">Revista Completa · 12 páginas</span>
      <a class="pdf-download" href="fanzine_mma.pdf" download>↓ Descargar</a>
    </div>
    <div class="pdf-frame-wrap">
      <iframe src="./fanzine_mma.pdf" title="Más Que Pelear — Artes Marciales"></iframe>
    </div>
  </div>

  <footer>
    <p>© 2025 · Más Que Pelear · Artes Marciales</p>
  </footer>

</body>
</html>
